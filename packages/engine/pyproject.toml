[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoedit"
version = "0.1.0"
description = "Automatic short-form video editor for talking-head videos (Persian-first)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.0",
  "ai-edge-litert>=1.0",
]

[project.optional-dependencies]
stt-local = ["faster-whisper>=1.0"]

[project.scripts]
autoedit = "autoedit.cli:main"

[tool.setuptools]
packages = ["autoedit"]
